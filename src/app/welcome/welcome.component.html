<div style="border: 1px red solid;" class="container">
  <div class="row">
    <div class="col-lg-8 col-md-8 col-sm-12 col-xs-12 offset-2">
      <div class="asso-header">
        <img src="images/asso-logo1.png" width="100" height="100" alt="">
        <br>
        <h1>
          You are welcome on asso platform
        </h1>
      </div>

      <div class="row">
        <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12" style="border: 1px blue solid;">

          <button
            matButton="elevated"
            style="font-size: 2.0em; position: absolute;"
            routerLink="/register" id="lg-btn-register">Register</button>
        </div>
        <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12" style="border: 1px green solid;">
          <button
            matButton="elevated"
            style="font-size: 2.0em; position: absolute;"
            routerLink="/login" id="lg-btn-login">Login</button>
        </div>
      </div>
    </div>
  </div>

</div>
